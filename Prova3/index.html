<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Foggia in 10 tappe</title>
  <meta name="description" content="Benvenuti a Foggia: scopri, vivi, ama la città." />
  <style>
    :root{
      --bg:#070B12;
      --txt:#EAF0FF;
      --stroke:rgba(255,255,255,.12);
      --shadow:0 18px 55px rgba(0,0,0,.45);
      --r:18px;
      --r2:22px;
    }
    *{ box-sizing:border-box; }
    body{
      margin:0;
      font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial;
      color:var(--txt);
      background:
        radial-gradient(1100px 600px at 50% -10%, rgba(88,120,255,.18), transparent 60%),
        radial-gradient(900px 520px at 100% 10%, rgba(255,122,66,.14), transparent 55%),
        var(--bg);
    }
    a{ color:inherit; text-decoration:none; }
    .wrap{ width:min(1120px, calc(100% - 32px)); margin:0 auto; }

    .hero{ padding:18px 0 10px; }
    .heroCard{
      height:min(62vh, 560px);
      border-radius:var(--r2);
      overflow:hidden;
      border:1px solid var(--stroke);
      box-shadow:var(--shadow);
      background:rgba(255,255,255,.02);
      position:relative;
    }
    .heroCard img{
      width:100%;
      height:100%;
      display:block;
      object-fit:cover;
      object-position:center;
      transform: scale(1.01);
      filter:saturate(1.03) contrast(1.03);
    }
    .heroCard::after{
      content:"";
      position:absolute;
      inset:0;
      background:
        radial-gradient(1000px 520px at 50% 0%, rgba(0,0,0,.18), transparent 60%),
        linear-gradient(to bottom, rgba(0,0,0,.06), rgba(0,0,0,.30));
      pointer-events:none;
    }

    .paths{ padding:18px 0 42px; }
    .row{
      display:grid;
      grid-template-columns:repeat(3, 1fr);
      gap:16px;
      align-items:stretch;
    }
    .iconCard{
      border-radius:var(--r);
      overflow:hidden;
      border:1px solid rgba(255,255,255,.14);
      background: rgba(255,255,255,.03);
      box-shadow: 0 18px 45px rgba(0,0,0,.35);
      transition: transform .18s ease, box-shadow .18s ease, border-color .18s ease;
      padding: 14px;
      display:flex;
      align-items:center;
      justify-content:center;
      min-height: 200px;
      position:relative;
    }
    .iconCard::before{
      content:"";
      position:absolute;
      inset:-40px;
      background: radial-gradient(closest-side, rgba(255,255,255,.10), transparent 70%);
      opacity:.0;
      transition: opacity .18s ease;
      pointer-events:none;
    }
    .iconCard:hover{
      transform: translateY(-2px);
      border-color: rgba(255,255,255,.24);
      box-shadow: 0 26px 70px rgba(0,0,0,.55);
    }
    .iconCard:hover::before{ opacity:.75; }
    .iconCard:active{ transform: translateY(-1px) scale(.995); }
    .iconCard img{
      width:min(100%, 340px);
      height:auto;
      display:block;
      filter: drop-shadow(0 18px 35px rgba(0,0,0,.35));
    }

    .hint{
      margin: 10px 0 0;
      color: rgba(234,240,255,.62);
      font-weight: 650;
      font-size: 13px;
    }

    @media (max-width: 900px){
      .row{ grid-template-columns:1fr; }
      .iconCard{ min-height: 180px; }
      .heroCard{ height:min(55vh, 520px); }
    }
    @media (prefers-reduced-motion: reduce){
      .iconCard{ transition:none; }
      .iconCard:hover{ transform:none; }
      .iconCard::before{ transition:none; }
    }
  </style>
</head>
<body>
  <main>
    <section class="hero">
      <div class="wrap">
        <div class="heroCard">
          <img src="assets/IMG_3963.png" alt="Benvenuti a Foggia" />
        </div>
      </div>
    </section>

    <section class="paths" id="percorsi">
      <div class="wrap">
        <div class="row" role="list">
          <a class="iconCard" role="listitem" href="scopri/index.html" aria-label="Scopri">
            <img src="assets/scopri.png" alt="Scopri" />
          </a>
          <a class="iconCard" role="listitem" href="vivi/index.html" aria-label="Vivi">
            <img src="assets/vivi.png" alt="Vivi" />
          </a>
          <a class="iconCard" role="listitem" href="ama/index.html" aria-label="Ama">
            <img src="assets/ama.png" alt="Ama" />
          </a>
        </div>
        <div class="hint">Tre ingressi. Un’unica città: attraversala, non consumarla.</div>
      </div>
    </section>
  </main>
</body>
</html>
