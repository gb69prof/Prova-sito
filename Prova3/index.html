<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Foggia in 10 tappe</title>
  <meta name="description" content="Benvenuti a Foggia: scopri, vivi, ama la città." />
  <style>
    :root{
      --bg:#070B12;
      --txt:#EAF0FF;
      --muted: rgba(234,240,255,.72);
      --radius: 18px;
      --shadow: 0 18px 55px rgba(0,0,0,.45);
    }
    *{ box-sizing:border-box; }
    body{
      margin:0;
      font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial;
      background: var(--bg);
      color: var(--txt);
    }
    .wrap{
      width:min(1120px, calc(100% - 32px));
      margin:0 auto;
    }
    .hero{
      padding:18px 0 10px;
    }
    .heroCard{
      border-radius: 22px;
      overflow:hidden;
      box-shadow: var(--shadow);
      border:1px solid rgba(255,255,255,.10);
    }
    .heroCard img{
      width:100%;
      height:min(62vh, 560px);
      object-fit:cover;
      display:block;
    }

    .paths{
      padding:14px 0 34px;
    }
    .pathsHead{
      display:flex;
      justify-content:space-between;
      align-items:flex-end;
      gap:18px;
      margin:10px 0 12px;
    }
    .pathsHead h2{
      margin:0;
      font-size:22px;
      letter-spacing:.2px;
    }
    .pathsHead p{
      margin:0;
      color:var(--muted);
      font-weight:650;
      max-width:60ch;
      line-height:1.35;
    }

    /* 3 immagini distinte sulla stessa linea, ciascuna 1/3 */
    .row{
      display:flex;
      gap:14px;
      align-items:stretch;
    }
    .card{
      flex: 1 1 33.333%;
      border-radius: var(--radius);
      overflow:hidden;
      border:1px solid rgba(255,255,255,.10);
      box-shadow: 0 18px 45px rgba(0,0,0,.35);
      transition: transform .18s ease, border-color .18s ease, box-shadow .18s ease;
      background: rgba(255,255,255,.02);
    }
    .card:hover{
      transform: translateY(-2px);
      border-color: rgba(255,255,255,.22);
      box-shadow: 0 26px 70px rgba(0,0,0,.45);
    }
    .card img{
      width:100%;
      height: 140px; /* “striscia” bassa */
      object-fit: cover;
      display:block;
    }

    @media (max-width: 900px){
      .row{ flex-direction:column; }
      .card img{ height: 128px; }
      .heroCard img{ height:min(55vh, 520px); }
    }
  </style>
</head>
<body>
  <main>
    <section class="hero">
      <div class="wrap">
        <div class="heroCard">
          <img src="assets/IMG_3963.png" alt="Benvenuti a Foggia" />
        </div>
      </div>
    </section>

    <section class="paths" id="percorsi">
      <div class="wrap">
        <div class="pathsHead">
          <div>
            <h2>Tre percorsi</h2>
            <p><b>Scopri</b> (racconto in 10 tappe), <b>Vivi</b> (cosa fare oggi), <b>Ama</b> (luoghi del cuore).</p>
          </div>
        </div>

        <div class="row" role="list">
          <a class="card" role="listitem" href="scopri/index.html" aria-label="Scopri">
            <img src="assets/scopri.png" alt="Scopri – Un tour come un racconto attraverso le 10 tappe" />
          </a>
          <a class="card" role="listitem" href="vivi/index.html" aria-label="Vivi">
            <img src="assets/vivi.png" alt="Vivi – Le stesse tappe viste sotto un'altra prospettiva: cosa puoi fare oggi" />
          </a>
          <a class="card" role="listitem" href="ama/index.html" aria-label="Ama">
            <img src="assets/ama.png" alt="Ama – Una specie di luoghi del cuore" />
          </a>
        </div>
      </div>
    </section>
  </main>
</body>
</html>
