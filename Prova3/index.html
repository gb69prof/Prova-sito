<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Foggia in 10 tappe</title>

<style>
:root{
  --bg:#070B12;
  --panel:#0c1220;
  --stroke:rgba(255,255,255,.12);
  --shadow:0 18px 45px rgba(0,0,0,.45);
  --r:18px;
}

*{box-sizing:border-box}

body{
  margin:0;
  font-family:system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial;
  background:var(--bg);
  color:#fff;
}

/* layout */
.wrap{
  width:min(1120px, calc(100% - 32px));
  margin:0 auto;
}

/* HERO */
.hero{
  padding:20px 0 10px;
}
.hero img{
  width:100%;
  height:min(62vh,560px);
  object-fit:cover;
  display:block;
  border-radius:22px;
  box-shadow:var(--shadow);
}

/* PERCORSI */
.paths{
  padding:20px 0 40px;
}

.row{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:16px;
}

/* CARD */
.card{
  background:var(--panel);
  border-radius:var(--r);
  border:1px solid var(--stroke);
  box-shadow:var(--shadow);
  display:flex;
  align-items:center;
  justify-content:center;
  height:150px;               /* altezza UNICA */
  padding:14px;
  transition:transform .18s ease, box-shadow .18s ease;
}

.card:hover{
  transform:translateY(-2px);
  box-shadow:0 26px 70px rgba(0,0,0,.55);
}

/* IMMAGINI */
.card img{
  max-width:100%;
  max-height:100%;
  object-fit:contain;         /* QUI è la chiave */
  display:block;
}

/* mobile */
@media (max-width:900px){
  .row{
    grid-template-columns:1fr;
  }
  .card{
    height:140px;
  }
}
</style>
</head>

<body>

<main class="wrap">

  <!-- COPERTINA -->
  <section class="hero">
    <img src="assets/IMG_3963.png" alt="Benvenuti a Foggia">
  </section>

  <!-- PERCORSI -->
  <section class="paths">
    <div class="row">

      <a class="card" href="scopri/index.html">
        <img src="assets/scopri.png" alt="Scopri">
      </a>

      <a class="card" href="vivi/index.html">
        <img src="assets/vivi.png" alt="Vivi">
      </a>

      <a class="card" href="ama/index.html">
        <img src="assets/ama.png" alt="Ama">
      </a>

    </div>
  </section>

</main>

</body>
</html>
